name: Deploy to AWS

on:
  push:
    branches: [dev, main]
    paths:
      - "agent.py"
      - "step_loader.py"
      - "registry.py"
      - "tools/**"
      - "plans/**"
      - "data/**"
      - "config/**"
      - "api/**"
      - "infra/**"
      - "requirements.txt"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'aws-prod' || 'aws-dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set stage and auto-generate defaults
        id: stage
        env:
          API_KEY_DEV: ${{ secrets.API_KEY_DEV }}
          API_KEY_PROD: ${{ secrets.API_KEY_PROD }}
          API_KEY_LEGACY: ${{ secrets.API_KEY }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGE="${{ inputs.stage }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            STAGE="prod"
          else
            STAGE="dev"
          fi
          echo "stage=$STAGE" >> $GITHUB_OUTPUT

          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

          if [[ "$STAGE" == "prod" ]]; then
            KEY="${API_KEY_PROD}"
          else
            KEY="${API_KEY_DEV}"
          fi
          if [[ -z "$KEY" ]]; then
            KEY="${API_KEY_LEGACY}"
          fi
          if [[ -z "$KEY" ]]; then
            echo "Missing API_KEY_DEV / API_KEY_PROD (or legacy API_KEY) GitHub secret"
            exit 1
          fi
          echo "api_key=$KEY" >> $GITHUB_OUTPUT

          if [[ -z "${{ vars.LANGSMITH_DEV_PROJECT }}" ]]; then
            echo "langsmith_dev_project=${REPO_NAME}-dev" >> $GITHUB_OUTPUT
          else
            echo "langsmith_dev_project=${{ vars.LANGSMITH_DEV_PROJECT }}" >> $GITHUB_OUTPUT
          fi

          if [[ -z "${{ vars.LANGSMITH_PROD_PROJECT }}" ]]; then
            echo "langsmith_prod_project=${REPO_NAME}-prod" >> $GITHUB_OUTPUT
          else
            echo "langsmith_prod_project=${{ vars.LANGSMITH_PROD_PROJECT }}" >> $GITHUB_OUTPUT
          fi

          if [[ -z "${{ vars.CORS_ALLOW_ORIGINS }}" ]]; then
            echo "cors_origins=*" >> $GITHUB_OUTPUT
          else
            echo "cors_origins=${{ vars.CORS_ALLOW_ORIGINS }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          pip install -r infra/requirements.txt

      - name: Set up QEMU (for ARM64 Docker builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: CDK Bootstrap
        working-directory: infra
        run: cdk bootstrap --app "python3 app.py" || true
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          SBIQ_AWS_REGION: ${{ env.AWS_REGION }}

      - name: CDK Deploy
        working-directory: infra
        run: |
          cdk deploy "SbiqConditionsStack-${{ steps.stage.outputs.stage }}" \
            --app "python3 app.py" \
            --require-approval never \
            --outputs-file ../output-${{ steps.stage.outputs.stage }}.json
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          SBIQ_AWS_REGION: ${{ env.AWS_REGION }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_DEV_PROJECT: ${{ steps.stage.outputs.langsmith_dev_project }}
          LANGSMITH_PROD_PROJECT: ${{ steps.stage.outputs.langsmith_prod_project }}
          CORS_ALLOW_ORIGINS: ${{ steps.stage.outputs.cors_origins }}

      - name: Update secrets
        run: |
          SECRETS_ARN=$(jq -r '."SbiqConditionsStack-${{ steps.stage.outputs.stage }}".AgentSecretsArn' output-${{ steps.stage.outputs.stage }}.json)

          if [[ "${{ steps.stage.outputs.stage }}" == "prod" ]]; then
            LANGSMITH_PROJECT="${{ steps.stage.outputs.langsmith_prod_project }}"
          else
            LANGSMITH_PROJECT="${{ steps.stage.outputs.langsmith_dev_project }}"
          fi

          aws secretsmanager put-secret-value \
            --secret-id "$SECRETS_ARN" \
            --secret-string "$(jq -n \
              --arg api_key "${{ steps.stage.outputs.api_key }}" \
              --arg anthropic "${{ secrets.ANTHROPIC_API_KEY }}" \
              --arg anthropic_model "${{ secrets.ANTHROPIC_MODEL }}" \
              --arg langsmith "${{ secrets.LANGSMITH_API_KEY }}" \
              --arg langsmith_project "$LANGSMITH_PROJECT" \
              '{
                API_KEY: $api_key,
                ANTHROPIC_API_KEY: $anthropic,
                ANTHROPIC_MODEL: $anthropic_model,
                LANGSMITH_API_KEY: $langsmith,
                LANGCHAIN_API_KEY: $langsmith,
                LANGSMITH_PROJECT: $langsmith_project
              }')"

      - name: Smoke test
        run: |
          API_URL=$(jq -r '."SbiqConditionsStack-${{ steps.stage.outputs.stage }}".ApiUrl' output-${{ steps.stage.outputs.stage }}.json)
          for i in $(seq 1 10); do
            if curl -sf "${API_URL}health" | jq -e '.status == "ok"' >/dev/null; then
              echo "Health OK"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1

      - name: Output API URL
        run: |
          API_URL=$(jq -r '."SbiqConditionsStack-${{ steps.stage.outputs.stage }}".ApiUrl' output-${{ steps.stage.outputs.stage }}.json)
          echo "### Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stage:** ${{ steps.stage.outputs.stage }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
